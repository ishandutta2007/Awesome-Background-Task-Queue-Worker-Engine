<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>

    <!-- Subtle blur filter -->
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 42px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 400;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
      letter-spacing: 0.5px;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dash 12s linear infinite;
    }
    .flow-line-rev {
      stroke-dasharray: 6, 6;
      animation: dash-rev 10s linear infinite;
    }
    .pulse-orb {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .pulse-orb-slow {
      animation: pulse 6s ease-in-out infinite alternate;
    }
    .packet {
      animation: travel-x 4s ease-in-out infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -200;
      }
    }
    @keyframes dash-rev {
      to {
        stroke-dashoffset: 200;
      }
    }
    @keyframes pulse {
      0% {
        opacity: 0.25;
        transform: scale(0.95);
      }
      100% {
        opacity: 0.6;
        transform: scale(1.08);
      }
    }
    @keyframes travel-x {
      0% {
        cx: 140;
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      80% {
        opacity: 1;
      }
      100% {
        cx: 1060;
        opacity: 0;
      }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Layer 1 - Behind Text) -->
  <g class="dynamic-background">
    <!-- Glowing Ambient Orbs -->
    <circle cx="200" cy="90" r="140" fill="#38bdf8" filter="url(#glow-blur)" class="pulse-orb" opacity="0.35" />
    <circle cx="1020" cy="110" r="160" fill="#818cf8" filter="url(#glow-blur)" class="pulse-orb-slow" opacity="0.3" />
    <circle cx="600" cy="360" r="120" fill="#c084fc" filter="url(#glow-blur)" class="pulse-orb" opacity="0.25" />

    <!-- Visualized Queue Pipeline / Workflow Flow Lines -->
    <path d="M 100 340 C 350 310, 450 370, 700 330 C 900 300, 1000 360, 1120 330" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.45" class="flow-line" />
    <path d="M 80 80 C 300 120, 500 50, 750 90 C 950 120, 1050 60, 1140 80" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.35" class="flow-line-rev" />

    <!-- Animated Queue Task Packets floating in pipeline -->
    <circle cy="340" r="5" fill="#38bdf8" filter="url(#node-glow)" class="packet" />
    <circle cy="80" r="4" fill="#a855f7" filter="url(#node-glow)" class="packet" style="animation-delay: -2s; animation-duration: 5s;" />

    <!-- Geometric Decorative Queue Nodes -->
    <rect x="70" y="325" width="28" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />
    <text x="84" y="343" fill="#38bdf8" font-size="12" text-anchor="middle" font-family="monospace">Q1</text>

    <rect x="1100" y="315" width="28" height="28" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.7" />
    <text x="1114" y="333" fill="#10b981" font-size="12" text-anchor="middle" font-family="monospace">W</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Bar & Branding (Layer 2 - Guaranteed Always Visible & Sharp) -->
  <g class="foreground-content">
    <!-- Top Pill Indicator -->
    <g transform="translate(600, 75)">
      <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <circle cx="-165" cy="0" r="5" fill="#10b981" filter="url(#node-glow)" />
      <text x="-148" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CURATED ECOSYSTEM GUIDE</text>
      <text x="80" y="5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">⚡ 2026 EDITION</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <g transform="translate(600, 160)">
      <text class="title-text" text-anchor="middle">
        <tspan fill="#ffffff">Awesome </tspan>
        <tspan fill="url(#primary-glow)">Background Task Queues</tspan>
      </text>
      <text class="title-text" text-anchor="middle" y="52" fill="#f8fafc">
        &amp; Distributed Worker Engines
      </text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(600, 258)">
      <text class="subtitle-text" text-anchor="middle">
        High-throughput queues, durable workflow orchestrators, schedulers &amp; serverless background processors
      </text>
    </g>

    <!-- Feature Category Badges -->
    <g transform="translate(600, 318)">
      <!-- Badge 1: Task Queues -->
      <g transform="translate(-320, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
        <text class="badge-text" text-anchor="middle" y="5">📥 Task Queues</text>
      </g>

      <!-- Badge 2: Durable Workflows -->
      <g transform="translate(-105, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.2" />
        <text class="badge-text" text-anchor="middle" y="5">🔄 Durable Execution</text>
      </g>

      <!-- Badge 3: Background Workers -->
      <g transform="translate(115, 0)">
        <rect x="-90" y="-16" width="180" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#a855f7" stroke-width="1.2" />
        <text class="badge-text" text-anchor="middle" y="5">⚙️ Worker Engines</text>
      </g>

      <!-- Badge 4: Schedulers -->
      <g transform="translate(325, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2" />
        <text class="badge-text" text-anchor="middle" y="5">⏱️ Job Schedulers</text>
      </g>
    </g>
  </g>
</svg>
